# A WebSocket server and client (RFC 6455) on top of the http package. The modules a program
# imports are the keys of [exports]; the frame codec and the task helpers stay private.
[package]
name = "websocket"
version = "0.1.0"

[dependencies]
http = { workspace = true }

[exports]
"websocket/client" = "src/client.nra"
"websocket/message" = "src/message.nra"
"websocket/server" = "src/server.nra"
"websocket/socket" = "src/socket.nra"

# The test program: `narrac run -sanitize packages/websocket`.
[[binary]]
name = "websocket-tests"
entry = "checks.run"
