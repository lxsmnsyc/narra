# Reads a YAML file into a typed value and writes it back. Run it from the repository root with
# `narrac run examples/yaml_config` or name a file: `narrac run examples/yaml_config my.yaml`.
[package]
name = "yaml_config"
version = "0.1.0"

[dependencies]
yaml = { workspace = true }

[[binary]]
name = "yaml_config"
entry = "yaml_config/main.run"
