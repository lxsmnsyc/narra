# An HTTP/1.1 client and server over std/net. The modules a program imports are
# the keys of [exports]; the parsing and framing modules stay private.
[package]
name = "http"
version = "0.1.0"

[exports]
"http/body" = "src/body.nra"
"http/client" = "src/client.nra"
"http/cookie" = "src/cookie.nra"
"http/error" = "src/error.nra"
"http/headers" = "src/headers.nra"
"http/request" = "src/request.nra"
"http/response" = "src/response.nra"
"http/server" = "src/server.nra"

# The test program: `narrac run -sanitize packages/http`.
[[binary]]
name = "http-tests"
entry = "checks.run"
