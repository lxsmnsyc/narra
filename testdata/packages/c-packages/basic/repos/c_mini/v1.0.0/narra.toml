# A C package: the C files come from an upstream repository at a tag, and nothing of them is copied here.
[package]
name = "c_mini"
version = "1.0.0"

[c]
git = "@REPOS@/upstream_mini"
tag = "v1.0.0"
sources = ["src/*.c", "!src/example.c"]
include = ["include"]
defines = ["MINI_SCALE=3", "MINI_SECRET"]
