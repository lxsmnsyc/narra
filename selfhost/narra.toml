# The Narra compiler written in Narra. Ported so far: the lexer, the parser and
# the AST dump (`narrac parse`), and package loading (`narrac pkg`).
[package]
name = "narrac"
# The compiler's own functions get their `from` markers once the seed reads them.
shared-results = "unchecked"

[[binary]]
name = "narrac"
entry = "main.run"
