# An echo server for WebSocket. Run it with `narrac run examples/websocket_echo` and connect to
# ws://127.0.0.1:9001. The first argument is the address to listen on and the second the port.
[package]
name = "websocket_echo"
version = "0.1.0"

[dependencies]
http = { workspace = true }
websocket = { workspace = true }

[[binary]]
name = "websocket_echo"
entry = "websocket_echo/main.run"
