# A YAML 1.2 reader and writer over std/shape. A program imports "yaml"; the scalar rules and the
# writer stay private.
[package]
name = "yaml"
version = "0.1.0"

[exports]
"yaml" = "src/yaml.nra"

# The test program: `narrac run -sanitize packages/yaml`.
[[binary]]
name = "yaml-tests"
entry = "checks.run"
