# A package with a `[c]` table: sources by pattern, an include folder, defines, and one table per system.
[package]
name = "tables"
version = "0.1.0"

[c]
sources = ["c/lib/*.c", "!c/lib/main.c"]
include = ["c/inc1", "c/inc2"]
defines = ["EXTRA=64"]

[c.os.Linux]
defines = ["OS_LINUX"]

[c.os.MacOS]
defines = ["OS_MACOS"]

[c.os.Windows]
sources = ["c/windows.c"]
defines = ["OS_WINDOWS"]
