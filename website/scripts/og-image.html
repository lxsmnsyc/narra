<!DOCTYPE html>
<!--
  The link preview image, public/og.png, laid out as Banig's OgImage. To redraw it after a change,
  run from website/:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --window-size=1200,630 --screenshot=public/og.png scripts/og-image.html
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('../public/fonts/bricolage-grotesque.woff2') format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Martian Mono';
        src: url('../public/fonts/martian-mono.woff2') format('woff2');
        font-weight: 100 800;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
        gap: 12px;
        padding: 12px;
        background: #ebebee;
        font-family: 'Bricolage Grotesque', sans-serif;
      }
      .main {
        display: grid;
        align-content: space-between;
        padding: 56px;
        border-radius: 28px;
        background: #121214;
        color: #f4f4f6;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 40px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .name svg {
        width: 44px;
        height: 44px;
      }
      h1 {
        margin: 0;
        font-size: 92px;
        font-weight: 800;
        line-height: 0.94;
        letter-spacing: -0.05em;
      }
      h1 em {
        padding: 0 0.16em 0.04em;
        border-radius: 0.22em;
        background: #ff7a45;
        color: #121214;
        font-style: normal;
      }
      .url {
        color: #b4b4bc;
        font: 400 22px 'Martian Mono', monospace;
      }
      .side {
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 12px;
      }
      .tile {
        padding: 40px;
        border-radius: 28px;
        background: #ffffff;
        color: #121214;
      }
      .code {
        display: flex;
        align-items: flex-end;
      }
      .code pre {
        margin: 0;
        font: 400 19px/1.75 'Martian Mono', monospace;
      }
      .k { color: #9c1f63; }
      .f { color: #1f4fb0; }
      .y { color: #006874; }
      .accent {
        background: #ff7a45;
        font-size: 30px;
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="name">
        <svg viewBox="0 0 32 32">
          <circle cx="16" cy="16" r="14" fill="#ff7a45" />
          <circle cx="14.5" cy="15" r="9.5" fill="none" stroke="#121214" stroke-width="1.6" opacity="0.55" />
          <circle cx="13.5" cy="14.5" r="5" fill="none" stroke="#121214" stroke-width="1.6" opacity="0.8" />
          <circle cx="13" cy="14" r="1.6" fill="#121214" />
        </svg>
        Narra
      </div>
      <h1>Easy to read, <em>hard</em> to break.</h1>
      <div class="url">A compiled language</div>
    </div>
    <div class="side">
      <div class="tile code"><pre><span class="k">export function</span> <span class="f">save</span>(
  path: <span class="y">string</span>,
  prices: <span class="y">Array</span>&lt;<span class="y">int</span>&gt;
): <span class="y">Result</span>&lt;<span class="y">int</span>, <span class="y">string</span>&gt;
  <span class="k">uses</span> io, alloc</pre></div>
      <div class="tile accent">See what a function touches before you call it.</div>
    </div>
  </body>
</html>
