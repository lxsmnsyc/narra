<!DOCTYPE html>
<!--
  The link preview image, public/og.png. To redraw it after a change, run from website/:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --window-size=1200,630 --screenshot=public/og.png scripts/og-image.html
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2')
          format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background: #f6f3ed;
        color: #1c1917;
        font-family: 'Geist', sans-serif;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 44px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .brand svg {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 0;
        font-size: 148px;
        font-weight: 600;
        line-height: 0.92;
        letter-spacing: -0.055em;
      }
      h1 em {
        font-family: 'Instrument Serif', serif;
        font-weight: 400;
        font-size: 1.12em;
        letter-spacing: -0.03em;
        color: #c2410c;
      }
      p {
        margin: 0;
        max-width: 900px;
        font-size: 34px;
        line-height: 1.35;
        color: #57534e;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="14" fill="#e8622e" />
        <circle cx="14.5" cy="15" r="9.5" fill="none" stroke="#fffaf5" stroke-width="1.6" opacity="0.55" />
        <circle cx="13.5" cy="14.5" r="5" fill="none" stroke="#fffaf5" stroke-width="1.6" opacity="0.8" />
        <circle cx="13" cy="14" r="1.6" fill="#fffaf5" />
      </svg>
      Narra
    </div>
    <h1>Code that <em>lasts.</em></h1>
    <p>The syntax of TypeScript, the speed of Rust. Values instead of shared references, no garbage collector.</p>
  </body>
</html>
