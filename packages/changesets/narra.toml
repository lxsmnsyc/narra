# Releases for the members of a workspace: changeset files, version bumps, changelogs and tags.
# The modules a program imports are the keys of [exports]; the command line is the binary.
[package]
name = "changesets"
version = "0.1.0"

[exports]
"changesets/changelog" = "src/changelog.nra"
"changesets/changeset" = "src/changeset.nra"
"changesets/commands" = "src/commands.nra"
"changesets/git" = "src/git.nra"
"changesets/release" = "src/release.nra"
"changesets/workspace" = "src/workspace.nra"

# The command line: `narrac run -bin changesets packages/changesets add ...`.
[[binary]]
name = "changesets"
entry = "cli.run"

# The test program: `narrac run -sanitize -bin changesets-tests packages/changesets`.
[[binary]]
name = "changesets-tests"
entry = "checks.run"
