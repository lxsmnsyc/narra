name: windows

on:
  pull_request:
    branches: [main]
    # Only changes that can reach a Windows build: the compiler, its runtime and std, the
    # checked programs and the check itself.
    paths:
      - seed/**
      - selfhost/**
      - std/**
      - testdata/**
      - scripts/cross-check.sh
      - .github/workflows/windows.yml

permissions:
  contents: read

jobs:
  windows-rows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        # The runner's git converts to CRLF on checkout by default, which breaks goldens and the seed.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - name: Windows rows of the cross-target check
        # Builds narrac from the committed seed on Windows, so it needs the
        # seed update that carries the windows-runtime changes.
        run: REQUIRE_RUN=1 sh scripts/cross-check.sh Windows-X86_64
